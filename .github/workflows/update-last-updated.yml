name: Update last updated date

on:
  push:
    branches:
      - main
    paths-ignore:
      - last-updated.txt

permissions:
  contents: write

concurrency:
  group: last-updated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Update date and push if changed
        shell: bash
        run: |
          date -u +'%Y-%m-%dT%H:%M:%SZ' > last-updated.txt
          if git diff --quiet -- last-updated.txt; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-updated.txt
          git commit -m "Update last updated date"
          git push
